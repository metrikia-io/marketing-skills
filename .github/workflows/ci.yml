name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter
        run: |
          failed=0
          for skill_md in skills/*/SKILL.md; do
            if [ ! -f "$skill_md" ]; then
              continue
            fi

            if ! head -1 "$skill_md" | grep -q "^---$"; then
              echo "FAIL: $skill_md does not start with ---"
              failed=1
              continue
            fi

            # Extract only the frontmatter block: skill bodies contain YAML
            # examples whose keys would otherwise be read as declared fields.
            fm=$(awk 'NR==1 && $0=="---" {f=1; next} f && $0=="---" {exit} f' "$skill_md")

            if ! echo "$fm" | grep -q "^name:"; then
              echo "FAIL: $skill_md is missing 'name:' in frontmatter"
              failed=1
            else
              declared=$(echo "$fm" | grep "^name:" | head -1 | sed 's/^name:[[:space:]]*//')
              dir=$(basename "$(dirname "$skill_md")")
              if [ "$declared" != "$dir" ]; then
                echo "FAIL: $skill_md declares name '$declared' but lives in directory '$dir'"
                failed=1
              fi
            fi

            if ! echo "$fm" | grep -q "^description:"; then
              echo "FAIL: $skill_md is missing 'description:' in frontmatter"
              failed=1
            fi

            if ! echo "$fm" | grep -q "^license:"; then
              echo "FAIL: $skill_md is missing 'license:' in frontmatter"
              failed=1
            fi
          done

          if [ $failed -eq 1 ]; then
            echo "Frontmatter validation failed"
            exit 1
          fi

          echo "Frontmatter validation passed"

      - name: Validate plugin manifests
        run: |
          python3 - <<'EOF'
          import json, re, sys

          failed = False

          with open(".claude-plugin/plugin.json") as f:
              plugin = json.load(f)
          for field in ("name", "description", "version", "license"):
              if field not in plugin:
                  print(f"FAIL: plugin.json is missing '{field}'")
                  failed = True
          if not isinstance(plugin.get("repository", ""), str):
              print("FAIL: plugin.json 'repository' must be a string")
              failed = True

          with open(".claude-plugin/marketplace.json") as f:
              marketplace = json.load(f)
          for field in ("name", "owner", "plugins"):
              if field not in marketplace:
                  print(f"FAIL: marketplace.json is missing '{field}'")
                  failed = True

          semver = re.compile(r"^\d+\.\d+\.\d+$")
          versions = {plugin.get("version")} | {
              p.get("version") for p in marketplace.get("plugins", [])
          }
          for v in versions:
              if v is None or not semver.match(v):
                  print(f"FAIL: invalid semver version: {v}")
                  failed = True
          if len(versions) > 1:
              print(f"FAIL: plugin.json and marketplace.json versions differ: {sorted(versions)}")
              failed = True

          if failed:
              sys.exit(1)
          print("Plugin manifest validation passed")
          EOF

      - name: Forbidden characters
        run: |
          # Check for em-dash (U+2014)
          if grep -r $'—' skills/ README.md 2>/dev/null; then
            echo "FAIL: Found em-dash character (U+2014) in skills or README.md"
            exit 1
          fi
          echo "Forbidden character check passed"

      - name: Internal reference sweep
        run: |
          failed=0
          forbidden_patterns=(
            "bin/console"
            "app:diana"
            "app:create"
            "app:seed"
            "app:index"
            "docker compose"
            "railway ssh"
            "make ci"
            "make test"
            "make db"
          )

          for pattern in "${forbidden_patterns[@]}"; do
            if grep -rn "$pattern" skills/ README.md 2>/dev/null; then
              echo "FAIL: Found internal reference '$pattern' in public content"
              failed=1
            fi
          done

          if [ $failed -eq 1 ]; then
            exit 1
          fi

          echo "Internal reference sweep passed"
